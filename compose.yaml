name: property-foundation
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: property
      POSTGRES_PASSWORD: property_local
      POSTGRES_DB: property
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - property_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U property -d property"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  property_postgres:
