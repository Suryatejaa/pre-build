name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: property
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: property_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U property -d property_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://property:ci_local_only@localhost:5432/property_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      # Builds must not require an application database or auth credentials.
      - run: npm run build
